# GitHub Actions workflow to publish images for the fork's main branch.
name: "Publish main images"
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docker:
    name: "Docker"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Fetch Git tags" # Required for axion-release-plugin
        run: git fetch --tags --unshallow

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Generate Docker tags"
        id: tags
        env:
          REPOSITORY: "ghcr.io/${{ github.repository }}"
        run: |
          echo "tags=${REPOSITORY,,}:main-${GITHUB_SHA::7},${REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: "Build and push"
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ steps.tags.outputs.tags }}

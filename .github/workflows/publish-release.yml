name: "Publish milestone image"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Milestone tag, for example 3.6.4-fork.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: "Docker"
    runs-on: ubuntu-latest
    steps:
      - name: "Validate milestone tag"
        env:
          TAG: "${{ inputs.tag }}"
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]] || {
            echo "Expected a tag like 3.6.4-fork.1"
            exit 1
          }

      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Fetch git tags" # Required for axion-release-plugin
        run: git fetch --tags --unshallow

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Generate Docker tags"
        id: tags
        env:
          REPOSITORY: "ghcr.io/${{ github.repository }}"
          TAG: "${{ inputs.tag }}"
        run: |
          echo "tags=${REPOSITORY,,}:$TAG,${REPOSITORY,,}:stable" >> "$GITHUB_OUTPUT"

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: "linux/amd64"
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=reposilite-amd64
          cache-to: type=gha,mode=max,scope=reposilite-amd64
